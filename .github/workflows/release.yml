# Builds the production mod JAR and publishes it, with SHA256SUMS.txt, as a GitHub Release.
#
# Runs ONLY when:
#   - a version tag such as v1.0.0 is pushed:   git tag v1.0.0 && git push origin v1.0.0
#   - it is started by hand from the Actions tab ("Release" -> "Run workflow") with a tag name.
# Ordinary commits and branch pushes never create a release.
#
# The tag must match `version` in build.gradle (tag v1.0.0 <-> version = "1.0.0"), so the version
# shown in-game (mcmod.info) always matches the release it was downloaded from.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.0.0 (must match version in build.gradle). An existing tag is built as-is; a new tag is created on the selected branch''s latest commit.'
        required: true
        type: string

# Nothing gets write access unless a job asks for it below.
permissions: {}

# Never run two releases for the same tag at once.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  # Fixed by archivesBaseName in build.gradle; the jar task leaves the version out of the file name.
  JAR_NAME: SeekerNetDiagnostics-1.8.9.jar

jobs:
  build:
    name: Build mod JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag_exists: ${{ steps.source.outputs.tag_exists }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to tell whether a manually entered tag already exists
          persist-credentials: false

      - name: Validate tag and select source commit
        id: source
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not a version tag like v1.0.0 or v2.1.0-beta.1"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            # Tag push, or a manual run for a tag that already exists: build exactly that commit.
            git checkout --quiet --detach "refs/tags/$TAG"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual run for a new tag: build the selected branch; the release job creates the tag here.
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '$TAG' was not found in the repository"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

          gradle_version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.gradle | head -n 1)
          if [ -z "$gradle_version" ]; then
            echo "::error::Could not read version from build.gradle"
            exit 1
          fi
          if [ "v$gradle_version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match build.gradle version \"$gradle_version\" (expected tag v$gradle_version)"
            exit 1
          fi
          echo "Building $TAG from $(git rev-parse --short HEAD)"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Build and test
        # gradlew is not marked executable in git, and this Gradle 2.7 script uses bash-only
        # syntax (arrays, `function`), so run it through bash; Ubuntu's sh is dash and cannot parse it.
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Collect production JAR and checksum
        run: |
          set -euo pipefail
          echo "build/libs contains:"
          ls -l build/libs
          jar_path="build/libs/$JAR_NAME"
          if [ ! -f "$jar_path" ]; then
            echo "::error::Expected $jar_path was not built"
            exit 1
          fi
          # The reobfuscated jar must carry the mod and must not bundle dev-only DevAuth.
          # List once (piping unzip straight into grep -q trips pipefail when grep exits early).
          contents=$(unzip -Z1 "$jar_path")
          if ! grep -qx 'mcmod.info' <<<"$contents"; then
            echo "::error::$JAR_NAME has no mcmod.info; this is not the mod JAR"
            exit 1
          fi
          if grep -qi 'devauth' <<<"$contents"; then
            echo "::error::$JAR_NAME contains DevAuth classes; refusing to release a development JAR"
            exit 1
          fi
          mkdir -p dist
          cp "$jar_path" dist/
          cd dist
          sha256sum "$JAR_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/${{ env.JAR_NAME }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release (and, for a manual run with a new tag, the tag)
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.build.outputs.sha }}
          TAG_EXISTS: ${{ needs.build.outputs.tag_exists }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --generate-notes)
          if [ "$TAG_EXISTS" = "true" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$SHA")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" \
            "dist/$JAR_NAME" \
            dist/SHA256SUMS.txt
